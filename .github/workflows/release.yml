name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: rust

      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Release Crate
        if: ${{ steps.release.outputs.release_created }}
        run: |
          cargo publish --token ${{ secrets.CARGO_PUBLISH_TOKEN }}

      - name: Locate crate
        if: ${{ steps.release.outputs.release_created }}
        id: crate
        shell: bash
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          name=$(jq -r '.packages[0].name' <<< "$metadata")
          version=$(jq -r '.packages[0].version' <<< "$metadata")
          path="target/package/${name}-${version}.crate"
          if [[ ! -f "$path" ]]; then
            echo "Crate not found: $path" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: SBOM
        if: ${{ steps.release.outputs.release_created }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/crate.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Attest build provenance for the published crate archive.
      - name: Attest build provenance
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.crate.outputs.path }}

      # Attest the SPDX SBOM for the same crate archive.
      - name: Attest SBOM
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.crate.outputs.path }}
          sbom-path: ${{ runner.temp }}/crate.spdx.json

      - name: Verify attestation
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "${{ steps.crate.outputs.path }}" --repo izyuumi/primality
